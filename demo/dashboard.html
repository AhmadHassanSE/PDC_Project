<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Delivery Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  /* Colours and type are taken from DeliveryTracker_video.mp4 (see video/make_video.py). */
  :root {
    --navy: #0E1526; --navy2: #16203A; --edge: #26335A;
    --orange: #FF9F1C; --teal: #2EC4B6; --red: #FF5454;
    --light: #F4F1EA; --muted: #C4CCDD; --dim: #808CA8;
    --panel: rgba(14, 21, 38, .95);
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: Consolas, ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  #fleet, #detail { scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
  html, body { margin: 0; height: 100%; background: var(--navy); color: var(--light);
               font: 15px/1.45 var(--sans); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--light); outline-offset: 2px; }
  #map { position: absolute; inset: 0; }

  .panel { background: var(--panel); border: 2px solid var(--edge); border-radius: 18px; }
  .eyebrow, .panel h3 { margin: 0; font: 13px/1.3 var(--mono); letter-spacing: .04em;
                        text-transform: uppercase; color: var(--c, var(--orange)); }
  .bar { display: block; height: 4px; border-radius: 2px; background: var(--edge); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--c); transition: width .8s; }

  /* Left column: live pill, then the fleet list */
  #side { position: absolute; z-index: 2; top: 24px; left: 24px; bottom: 24px; width: 316px;
          display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
  #side > * { pointer-events: auto; }
  #hud { align-self: flex-start; max-width: 100%; display: flex; align-items: center; gap: 10px;
         padding: 8px 18px 8px 14px; border-radius: 21px; font-size: 16px; }
  #hud b { font-weight: 600; }
  #hud span { color: var(--muted); font-size: 14px; }
  #hud code { font: 13px var(--mono); color: var(--light); }
  #hud .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); }
  #hud.live .dot { background: var(--red); animation: blink 1.1s ease-in-out infinite alternate; }
  #hud.error { border-color: var(--red); border-radius: 18px; align-items: flex-start; }
  #hud.error .dot { background: var(--red); margin-top: 5px; }
  @keyframes blink { to { opacity: .35; } }

  #fleet-panel { display: flex; flex-direction: column; min-height: 0; padding: 18px 0 8px; }
  #fleet-panel header { display: flex; align-items: baseline; justify-content: space-between;
                        padding: 0 18px 12px; border-bottom: 2px solid var(--edge); }
  #fleet-panel h1 { margin: 2px 0 0; font-size: 22px; font-weight: 600; line-height: 1.2; }
  #all { background: none; border: 2px solid var(--edge); border-radius: 15px; padding: 3px 12px;
         font-size: 14px; font-weight: 600; cursor: pointer; }
  #all:hover:enabled { border-color: var(--light); }
  #all:disabled { color: var(--dim); cursor: default; }
  #fleet { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  #fleet li { display: flex; align-items: flex-start; border-left: 4px solid transparent; }
  #fleet li + li { border-top: 1px solid var(--edge); }
  #fleet li.selected { border-left-color: var(--c); background: var(--navy2); }
  #fleet input { flex: none; width: 18px; height: 18px; margin: 15px 0 0 14px; accent-color: var(--c); cursor: pointer; }
  #fleet .row { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr auto; gap: 1px 10px;
                padding: 11px 18px 13px 12px; text-align: left; background: none; border: 0; cursor: pointer; }
  #fleet .row:hover .dest { color: var(--c); }
  #fleet .id { font: 13px var(--mono); color: var(--c); }
  #fleet .status { font-size: 13px; color: var(--muted); }
  #fleet .status, #fleet .kg { text-align: right; }
  #fleet .dest { grid-column: 1 / -1; font-size: 17px; font-weight: 600; }
  #fleet .load, #fleet .kg { font-size: 14px; color: var(--muted); }
  #fleet .bar { grid-column: 1 / -1; margin-top: 8px; }
  #fleet li.off .row { opacity: .5; }
  #follow-row { display: flex; align-items: center; gap: 8px; padding: 10px 18px 6px;
                border-top: 2px solid var(--edge); font-size: 14px; color: var(--muted); }
  #follow-row input { accent-color: var(--orange); }
  #hint { margin: 0; padding: 10px 18px 6px; border-top: 2px solid var(--edge); font-size: 14px; color: var(--muted); }

  /* Right: one truck's delivery sheet */
  #detail { position: absolute; z-index: 2; top: 24px; right: 24px; width: 356px; max-height: calc(100% - 150px);
            overflow-y: auto; padding: 20px 22px 6px; }
  #detail header { position: relative; padding-right: 36px; }
  #detail h2 { margin: 4px 0 0; font-size: 24px; font-weight: 600; line-height: 1.2; }
  #detail .sub { margin: 2px 0 0; color: var(--muted); }
  #detail .close { position: absolute; top: -4px; right: -8px; width: 34px; height: 34px; border-radius: 50%;
                   background: none; border: 2px solid var(--edge); font-size: 18px; line-height: 1; cursor: pointer; }
  #detail .close:hover { border-color: var(--light); }
  #detail .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 12px; }
  #detail .stats b { display: block; font-size: 44px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #detail .stats span { color: var(--muted); }
  #detail section { margin-top: 18px; padding: 16px 0 14px; border-top: 2px solid var(--edge); }
  #detail dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; margin: 10px 0 0; }
  #detail dt { color: var(--dim); }
  #detail dd { margin: 0; }
  #detail table { width: 100%; margin-top: 8px; border-collapse: collapse; }
  #detail td, #detail th { padding: 5px 0; text-align: left; font-weight: 400; border-bottom: 1px solid var(--edge); }
  #detail td + td { padding-left: 12px; color: var(--muted); white-space: nowrap; }
  #detail td:last-child, #detail tfoot th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #detail tfoot th { border: 0; font-weight: 600; }
  #detail .note { margin: 10px 0 0; padding-left: 10px; border-left: 4px solid var(--c); }
  #detail .topic { margin: 3px 0 8px; font-size: 20px; font-weight: 600; }
  #feed { list-style: none; margin: 0; padding: 0; font: 14px/2 var(--mono); }
  #feed li { display: flex; gap: 22px; }
  #feed time { color: var(--dim); }
  #feed li:first-child span { color: var(--c); }
  #feed .empty { font-family: var(--sans); color: var(--muted); line-height: 1.45; }

  /* Things drawn on the map */
  .mk { width: 20px; height: 20px; cursor: pointer; }
  .mk .dot { position: absolute; inset: 0; border-radius: 50%; background: var(--light); border: 4px solid var(--c); }
  .mk .ring { position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--c); opacity: 0; }
  .mk.moving .ring { animation: ping 1.6s ease-out infinite; }
  @keyframes ping { from { transform: scale(.5); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }
  .pill { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); white-space: nowrap;
          padding: 3px 12px; border-radius: 15px; border: 2px solid var(--c); background: var(--panel);
          font: 600 14px/1.4 var(--sans); color: var(--light); }
  .mk.selected .pill { background: var(--c); color: var(--navy); }
  .depot .dot { background: var(--light); border-color: var(--navy); outline: 3px solid rgba(244, 241, 234, .4); }
  .depot { cursor: default; }
  .depot .pill { left: auto; right: 28px; }
  .pin { cursor: pointer; }
  .pin svg { display: block; }
  .pin .pill { left: 32px; top: 13px; display: none; }
  .pin.selected .pill { display: block; }

  .maplibregl-ctrl-group { background: var(--navy); border: 2px solid var(--edge); border-radius: 12px; box-shadow: none; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--edge); }
  .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1); }
  .maplibregl-ctrl-attrib { background: none !important; color: var(--dim); font: 12px var(--sans); }
  .maplibregl-ctrl-attrib a { color: var(--dim); }

  @media (max-width: 760px) {
    #side { top: 12px; left: 12px; right: 12px; bottom: auto; width: auto; max-height: 46%; }
    #detail { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; max-height: 52%; }
    .has-detail #fleet-panel { display: none; }
    .maplibregl-ctrl-top-right, .maplibregl-ctrl-bottom-right .maplibregl-ctrl-group { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #hud.live .dot, .mk.moving .ring { animation: none; }
    .bar i { transition: none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="side">
  <div id="hud" class="panel" role="status"><i class="dot"></i><b>Connecting</b></div>
  <div id="fleet-panel" class="panel" inert>
    <header>
      <div>
        <p class="eyebrow" id="tracker-name"></p>
        <h1>Fleet</h1>
      </div>
      <button id="all" type="button" disabled>Track all</button>
    </header>
    <ul id="fleet"></ul>
    <label id="follow-row" hidden><input type="checkbox" id="follow" checked> Keep this truck centred</label>
    <p id="hint" hidden>No trucks on the map. Tick a truck to track it.</p>
  </div>
</div>

<aside id="detail" class="panel" hidden aria-label="Truck details"></aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NAVY = "#0E1526";

let cfg, map, trucks = [], selected = null;
const tracked = new Set();           // ids of the trucks shown on the map; starts as all of them

function metres(a, b) {              // a, b are [lon, lat]
  const r = Math.PI / 180, dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
const line = coords => coords.length < 2
  ? { type: "FeatureCollection", features: [] }
  : { type: "Feature", geometry: { type: "LineString", coordinates: coords } };

/* ---------- fleet list ---------- */
function buildFleet() {
  $("#tracker-name").textContent = cfg.tracker;
  $("#fleet").innerHTML = trucks.map(t => `
    <li data-id="${t.id}" style="--c:${t.color}">
      <input type="checkbox" checked aria-label="Track ${t.id} on the map">
      <button type="button" class="row" aria-label="Show details for ${t.id}, going to ${esc(t.destination)}">
        <span class="id">${t.id}</span><span class="status"></span>
        <span class="dest">${esc(t.destination)}</span>
        <span class="load">${esc(t.load)}</span><span class="kg">${t.kg.toLocaleString()} kg</span>
        <span class="bar"><i></i></span>
      </button>
    </li>`).join("");
  $("#fleet").addEventListener("change", e => setTracked(e.target.closest("li").dataset.id, e.target.checked));
  $("#fleet").addEventListener("click", e => {
    const row = e.target.closest(".row");
    if (row) select(row.parentElement.dataset.id);
  });
  $("#all").addEventListener("click", () => { trucks.forEach(t => tracked.add(t.id)); trackingChanged(); });
  $("#detail").addEventListener("click", e => { if (e.target.closest(".close")) select(null); });
}

function setTracked(id, on) {
  on ? tracked.add(id) : tracked.delete(id);
  if (!on && selected === id) selected = null, renderDetail();
  trackingChanged();
}

function trackingChanged() {
  for (const t of trucks) {
    const on = tracked.has(t.id);
    t.li.classList.toggle("off", !on);
    t.li.querySelector("input").checked = on;
    for (const layer of ["plan", "glow", "trail"]) map.setLayoutProperty(`${layer}-${t.id}`, "visibility", on ? "visible" : "none");
    t.pin.getElement().style.display = on ? "" : "none";
  }
  $("#all").disabled = tracked.size === trucks.length;
  $("#follow-row").hidden = tracked.size !== 1;
  $("#hint").hidden = tracked.size !== 0;
  paint();
  fitView();
}

function select(id) {
  selected = id === selected ? null : id;
  renderDetail();
  if (selected) for (const layer of ["glow", "trail"]) map.moveLayer(`${layer}-${selected}`);  // draw it on top
  // Opening a truck that was hidden puts it back on the map. Either way: repaint, then refit
  // the view to make room for (or reclaim) the space under the delivery sheet.
  if (selected && !tracked.has(selected)) { tracked.add(selected); trackingChanged(); }
  else { paint(); fitView(); }
}

/* ---------- one truck's delivery sheet ---------- */
function renderDetail() {
  const t = trucks.find(t => t.id === selected), el = $("#detail");
  el.hidden = !t;
  document.body.classList.toggle("has-detail", !!t);   // on a phone the sheet takes the fleet list's place
  if (!t) return;
  el.style.setProperty("--c", t.color);
  el.innerHTML = `
    <header>
      <p class="eyebrow">${t.id} / <span id="d-status"></span></p>
      <h2>${esc(t.destination)}</h2>
      <p class="sub">from ${esc(cfg.depot.name)}</p>
      <button type="button" class="close" aria-label="Close truck details">&#10005;</button>
    </header>
    <div class="stats">
      <div><b id="d-km">0.0</b><span>of ${t.routeKm.toFixed(1)} km driven</span></div>
      <div><b id="d-n">0</b><span>positions stored</span></div>
    </div>
    <span class="bar"><i id="d-bar"></i></span>
    <section>
      <h3>Delivery</h3>
      <dl>
        <dt>Order</dt><dd>${esc(t.order)}</dd>
        <dt>Deliver to</dt><dd>${esc(t.receiver)}</dd>
        <dt>Due</dt><dd>${esc(t.window)}</dd>
        <dt>Driver</dt><dd>${esc(t.driver)}</dd>
        <dt>Vehicle</dt><dd>${esc(t.vehicle)}</dd>
      </dl>
    </section>
    <section>
      <h3>Cargo</h3>
      <table>
        <tbody>${t.cargo.map(([item, qty, kg]) => `<tr><td>${esc(item)}</td><td>${esc(qty)}</td><td>${kg.toLocaleString()} kg</td></tr>`).join("")}</tbody>
        <tfoot><tr><th colspan="2">Total load</th><th>${t.kg.toLocaleString()} kg</th></tr></tfoot>
      </table>
      <p class="note">${esc(t.note)}</p>
    </section>
    <section>
      <h3>AWS IoT Core / MQTT</h3>
      <p class="topic">${esc(cfg.topic)}</p>
      <ol id="feed"></ol>
    </section>`;
  el.scrollTop = 0;
}

/* ---------- map ---------- */
function initMap() {
  const style = cfg.apiKey
    ? `https://maps.geo.${cfg.region}.amazonaws.com/v2/styles/Standard/descriptor?key=${cfg.apiKey}&color-scheme=Dark`
    : { version: 8,
        sources: {
          base: { type: "raster", tileSize: 256, maxzoom: 16,
                  tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"],
                  attribution: "Basemap: Esri, HERE, Garmin, &copy; OpenStreetMap contributors" },
          names: { type: "raster", tileSize: 256, maxzoom: 16,
                   tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"] } },
        layers: [
          // The grey basemap is blended over flat blue to get the video's navy map.
          { id: "bg", type: "background", paint: { "background-color": "#132A64" } },
          { id: "base", type: "raster", source: "base", paint: { "raster-opacity": 0.5, "raster-contrast": 0.3 } },
          { id: "names", type: "raster", source: "names", paint: { "raster-opacity": 0.55 } }] };

  map = new maplibregl.Map({ container: "map", style, center: cfg.depot.at, zoom: 12, attributionControl: { compact: false } });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

  map.on("load", () => {
    trucks.forEach((t, i) => {
      // Trucks often share a road, so each trail is drawn a few pixels to the side of the next.
      const offset = (i - (trucks.length - 1) / 2) * 5;
      map.addSource(`plan-${t.id}`, { type: "geojson", data: line(t.route) });
      map.addSource(`trail-${t.id}`, { type: "geojson", data: line([]) });
      const round = { "line-cap": "round", "line-join": "round" };
      map.addLayer({ id: `plan-${t.id}`, type: "line", source: `plan-${t.id}`,
                     paint: { "line-color": "#C4CCDD", "line-opacity": 0.45, "line-width": 2, "line-dasharray": [2, 2.5] } });
      map.addLayer({ id: `glow-${t.id}`, type: "line", source: `trail-${t.id}`, layout: round,
                     paint: { "line-color": t.color, "line-width": 16, "line-blur": 12, "line-opacity": 0.5, "line-offset": offset } });
      map.addLayer({ id: `trail-${t.id}`, type: "line", source: `trail-${t.id}`, layout: round,
                     paint: { "line-color": t.color, "line-width": 4.5, "line-offset": offset } });

      const pin = document.createElement("div");
      pin.className = "pin"; pin.style.setProperty("--c", t.color); pin.title = t.destination;
      pin.innerHTML = `<svg width="26" height="34" viewBox="0 0 26 34" aria-hidden="true">
        <path d="M13 0a13 13 0 0 1 13 13c0 9-13 21-13 21S0 22 0 13A13 13 0 0 1 13 0z" fill="${t.color}"/>
        <circle cx="13" cy="13" r="5" fill="${NAVY}"/></svg><span class="pill">${esc(t.destination)}</span>`;
      pin.addEventListener("click", () => select(t.id));
      t.pin = new maplibregl.Marker({ element: pin, anchor: "bottom" }).setLngLat(t.end).addTo(map);

      const mk = document.createElement("div");
      mk.className = "mk"; mk.style.setProperty("--c", t.color);
      mk.innerHTML = `<i class="ring"></i><i class="dot"></i><span class="pill">${t.id}</span>`;
      mk.addEventListener("click", () => select(t.id));
      t.marker = new maplibregl.Marker({ element: mk });
      t.onMap = false;
    });
    const depot = document.createElement("div");
    depot.className = "mk depot"; depot.style.setProperty("--c", "#F4F1EA");
    depot.innerHTML = `<i class="dot"></i><span class="pill">${esc(cfg.depot.name)}</span>`;
    new maplibregl.Marker({ element: depot }).setLngLat(cfg.depot.at).addTo(map);

    $("#fleet-panel").inert = false;   // the list is live once the map has its layers
    fitView(0);
    refresh();
    setInterval(refresh, 2000);
  });
}

function fitView(duration = 800) {
  const box = new maplibregl.LngLatBounds();
  for (const t of trucks) if (tracked.has(t.id)) t.route.forEach(p => box.extend(p));
  if (box.isEmpty()) return;
  map.fitBounds(box, { duration, maxZoom: 15, padding: freeArea() });
}

/* The part of the map that the panels don't cover, as padding from each edge. */
function freeArea() {
  return innerWidth > 760 ? { top: 70, bottom: 70, left: 380, right: selected ? 420 : 90 }
                          : { top: 40, bottom: 40, left: 40, right: 40 };
}

/* ---------- live data ---------- */
async function refresh() {
  try {
    const data = await (await fetch("/api/positions")).json();
    if (data.error) throw new Error(data.error);
    for (const t of trucks) {
      t.positions = data.trucks[t.id] || [];
      t.coords = t.positions.map(p => [p.lon, p.lat]);
      t.km = t.coords.reduce((sum, p, i) => i ? sum + metres(t.coords[i - 1], p) : 0, 0) / 1000;
      const last = t.coords[t.coords.length - 1];
      // Within 100 m of the drop-off counts as delivered (the tracker ignores moves under 30 m).
      t.status = !last ? "At the depot" : metres(last, t.end) < 100 ? "Delivered" : "On the road";
      t.progress = t.status === "Delivered" ? 1 : Math.min(1, t.km / t.routeKm);
    }
    paint();
    const moving = trucks.filter(t => t.status === "On the road").length;
    const done = trucks.filter(t => t.status === "Delivered").length;
    setHud(moving ? "live" : "",
      moving ? "Live" : done ? "All trips finished" : "Waiting for the trucks",
      moving ? `${moving} on the road${done ? `, ${done} delivered` : ""}`
             : done ? `${done} of ${trucks.length} delivered` : "Run <code>py truck_simulator.py</code>");
  } catch (e) {
    setHud("error", "Can't read the tracker", `${esc(e.message)}. Check that dashboard.py is still running and that demo/aws_credentials holds a working key.`);
  }
}

function setHud(state, title, detail) {
  const html = `<i class="dot"></i><div><b>${title}</b> <span>${detail}</span></div>`;
  if ($("#hud").dataset.html === html) return;       // don't re-announce the same status every 2 s
  $("#hud").className = "panel " + state;
  $("#hud").dataset.html = $("#hud").innerHTML = html;
}

/* Push the current state of every truck to the list, the map and the open delivery sheet. */
function paint() {
  for (const t of trucks) {
    if (!t.coords) continue;
    const on = tracked.has(t.id), last = t.coords[t.coords.length - 1];
    t.li.classList.toggle("selected", t.id === selected);
    t.li.querySelector(".status").textContent = t.status;
    t.li.querySelector(".bar i").style.width = t.progress * 100 + "%";
    map.getSource(`trail-${t.id}`).setData(line(t.coords));
    t.pin.getElement().classList.toggle("selected", t.id === selected);

    const show = on && !!last;
    if (show) t.marker.setLngLat(last);
    if (show !== t.onMap) { show ? t.marker.addTo(map) : t.marker.remove(); t.onMap = show; }
    const mk = t.marker.getElement();
    mk.classList.toggle("moving", t.status === "On the road");
    mk.classList.toggle("selected", t.id === selected);
    mk.style.zIndex = t.id === selected ? 2 : 1;
  }
  const only = tracked.size === 1 && trucks.find(t => tracked.has(t.id));
  if (only && only.coords?.length && $("#follow").checked)
    map.easeTo({ center: only.coords[only.coords.length - 1], padding: freeArea(), duration: 800 });

  const t = trucks.find(t => t.id === selected);
  if (!t || !t.coords) return;
  $("#d-status").textContent = t.status;
  $("#d-km").textContent = t.km.toFixed(1);
  $("#d-n").textContent = t.positions.length;
  $("#d-bar").style.width = t.progress * 100 + "%";
  $("#feed").innerHTML = t.positions.length
    ? t.positions.slice(-7).reverse().map(p =>
        `<li><time>${new Date(p.time).toLocaleTimeString("en-GB")}</time><span>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span></li>`).join("")
    : `<li class="empty">No positions yet. They appear here as soon as ${t.id} starts reporting.</li>`;
}

(async () => {
  try {
    cfg = await (await fetch("/api/fleet")).json();
  } catch (e) {
    return setHud("error", "Can't load the fleet", "Start the dashboard with <code>py dashboard.py</code> and reload this page.");
  }
  trucks = cfg.trucks;
  trucks.forEach(t => { tracked.add(t.id); t.kg = t.cargo.reduce((sum, c) => sum + c[2], 0); });
  buildFleet();
  trucks.forEach(t => t.li = $(`#fleet li[data-id="${t.id}"]`));
  initMap();
})();
</script>
</body>
</html>
